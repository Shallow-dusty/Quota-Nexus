[package]
name = "aiqm-probes"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
regex = "1"
# TLS 策略与 DESIGN.md v0.4.0 一致：Windows 使用系统证书库（schannel）。
# 注意：reqwest 0.13 的 default-tls 已切换为 rustls；Windows 系统证书库必须
# 显式启用 native-tls feature（Windows=schannel，Linux=系统 OpenSSL）。
reqwest = { version = "0.13", default-features = false, features = [
  "blocking",
  "gzip",
  "native-tls",
] }
scraper = "0.24"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
time = { version = "0.3", features = ["formatting", "parsing", "macros"] }
url = "2"
uuid = { version = "1", features = ["v4"] }
