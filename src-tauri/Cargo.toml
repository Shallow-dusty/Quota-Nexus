[package]
name = "ai-quota-monitor"
version = "0.1.0"
description = "Local multi-provider quota monitor"
edition.workspace = true
license.workspace = true

[lib]
name = "ai_quota_monitor_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
keyring = { version = "4.1.5", default-features = false, features = ["v1", "windows-native-keyring-store"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "native-tls", "socks"] }
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros"] }
tauri = { version = "2", features = [] }
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync"] }
uuid = { version = "1", features = ["v4"] }
zeroize = "1"
url = "2"

[dev-dependencies]
tempfile = "3"
